name: build

# Tag a version to ship it: git tag v1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: csvSync-macos-arm64.zip
          - os: windows-latest
            artifact: csvSync-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller

      # main/web is the UI (HTML/CSS/JS); main/app.py finds it next to itself.
      # PyInstaller 6 accepts ":" as the --add-data separator on Windows too.

      # macOS: build a .app bundle and zip it.
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name csvSync --paths . --add-data "main/web:main/web" --noconfirm main/__main__.py
          ditto -c -k --keepParent dist/csvSync.app "${{ matrix.artifact }}"

      # Windows: build a single executable.
      - if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name csvSync --paths . --add-data "main/web:main/web" --noconfirm main/__main__.py
          Move-Item dist/csvSync.exe "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "csvSync $GITHUB_REF_NAME" \
            csvSync-*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}