name: build

# Tag a version to ship it:  git tag v1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: SheetSync-macos-arm64.zip
          - os: windows-latest
            artifact: SheetSync-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      # onedir, not onefile: PyInstaller deprecated --onefile with .app bundles
      # ("clashes with macOS's security"), and it becomes an error in v7.
      # A .app is already one double-clickable icon, and it zips to the same size.
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name SheetSync --paths . --noconfirm main/__main__.py
          ditto -c -k --keepParent dist/SheetSync.app "${{ matrix.artifact }}"

      # Windows has no bundle format, so onefile is what makes it one icon.
      - if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name SheetSync --paths . --noconfirm main/__main__.py
          Move-Item dist/SheetSync.exe "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes SheetSync-*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
