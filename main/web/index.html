<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>csvSync</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- data-state: setup | downloading | running | error. style.css shows and hides by it. -->
<body data-state="setup">
<main>
  <header class="status" id="status" data-mark="hollow">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <h1 id="word">ready</h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <div class="cards">
    <section class="card alert only-error" id="alert" role="alert" aria-labelledby="alert-title">
      <h2 id="alert-title"></h2>
      <p id="alert-body"></p>
      <ol id="alert-steps">
        <li>In the sheet, click Share.</li>
        <li>Under General access, choose Anyone with the link.</li>
        <li>Keep the role as Viewer, then click Done.</li>
      </ol>
      <button type="button" class="btn outline" id="open-sheet">Open Sheet</button>
    </section>

    <section class="card only-setup source" aria-labelledby="h-source">
      <h2 class="section" id="h-source">Source</h2>
      <label for="link">Google Sheet link</label>
      <input id="link" type="text" class="field" spellcheck="false" autocomplete="off"
             autocapitalize="off" placeholder="https://docs.google.com/spreadsheets/d/…"
             aria-describedby="link-note">
      <p class="note" id="link-note" hidden></p>
      <label for="tab">Tab</label>
      <div class="select"><select id="tab" class="field" aria-describedby="tab-note"></select></div>
      <p class="note" id="tab-note" hidden></p>
    </section>

    <section class="card only-setup save" aria-labelledby="h-save">
      <h2 class="section" id="h-save">Save to</h2>
      <label for="filename">File name</label>
      <div class="field affix">
        <input id="filename" type="text" spellcheck="false" autocomplete="off" autocapitalize="off">
        <span aria-hidden="true">.csv</span>
      </div>
      <label for="folder">Folder</label>
      <div class="row">
        <div class="well">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v8h13v-7h-6.5l-1.5-2h-5z"/></svg>
          <input id="folder" type="text" readonly tabindex="-1" aria-describedby="folder-note">
        </div>
        <button type="button" class="btn" id="choose">Choose…</button>
      </div>
      <p class="note" id="folder-note" hidden></p>
      <p class="hint" id="saves"></p>
    </section>

    <section class="card only-setup schedule" aria-labelledby="h-schedule">
      <h2 class="section" id="h-schedule">Schedule</h2>
      <div class="segments" role="group" aria-labelledby="h-schedule">
        <button type="button" data-interval="3">3 s</button>
        <button type="button" data-interval="5">5 s</button>
        <button type="button" data-interval="10">10 s</button>
        <button type="button" data-interval="0">Once</button>
      </div>
    </section>

    <section class="card only-run summary" aria-label="Current sync" id="summary">
      <div class="route">
        <span class="chip" id="sum-tab"></span>
        <svg class="icon arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
        <span class="file" id="sum-file"></span>
        <span class="where" id="sum-folder"></span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-labelledby="bar-left"><span></span></div>
      <div class="captions">
        <span id="bar-left"></span>
        <span id="bar-right"></span>
      </div>
    </section>

    <section class="card only-run activity" aria-labelledby="h-activity">
      <h2 class="section" id="h-activity">Activity</h2>
      <ol class="log" id="log" tabindex="0" aria-labelledby="h-activity"></ol>
      <div class="row end">
        <button type="button" class="btn" id="open-file" disabled>Open File</button>
        <button type="button" class="btn" id="reveal" disabled>Show in Finder</button>
      </div>
    </section>
  </div>

  <div class="actions">
    <p class="hint only-run">Stop to change settings.</p>
    <p class="hint error-text" id="action-note" hidden></p>
    <button type="button" class="btn primary only-setup" id="primary">Start Sync</button>
    <button type="button" class="btn only-run" id="stop">Stop</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
